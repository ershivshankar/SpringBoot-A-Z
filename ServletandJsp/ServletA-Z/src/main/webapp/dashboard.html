
<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
        }

        .sidebar {
            width: 220px;
            height: 100vh;
            background-color: #2c3e50;
            color: white;
            position: fixed;
            padding-top: 20px;
        }

        .sidebar h2 {
            text-align: center;
        }

        .sidebar a {
            display: block;
            color: white;
            padding: 15px 20px;
            text-decoration: none;
        }

        .sidebar a:hover {
            background-color: #34495e;
        }

        .main {
            margin-left: 240px;
            padding: 20px;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background-color: white;
            padding: 20px;
            flex: 1;
            border-radius: 8px;
            box-shadow: 0 2px 5px #ccc;
        }

        .card h3 {
            color: #555;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #3498db;
            color: white;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h2>Dashboard</h2>

        <a href="#">Home</a>
        <a href="#">Users</a>
        <a href="#">Reports</a>
        <a href="#">Settings</a>
        <a href="#">Logout</a>
    </div>

    <div class="main">

        <h1>Welcome to Dashboard</h1>
        <p>Here is your dashboard overview.</p>

        <div class="cards">

            <div class="card">
                <h3>Total Users</h3>
                <h2>150</h2>
            </div>

            <div class="card">
                <h3>Total Products</h3>
                <h2>75</h2>
            </div>

            <div class="card">
                <h3>Total Orders</h3>
                <h2>45</h2>
            </div>

        </div>

        <h2>Recent Activity</h2>

        <table>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Activity</th>
                <th>Status</th>
            </tr>

            <tr>
                <td>1</td>
                <td>Rahul</td>
                <td>Login</td>
                <td>Success</td>
            </tr>

            <tr>
                <td>2</td>
                <td>Priya</td>
                <td>Registration</td>
                <td>Success</td>
            </tr>

            <tr>
                <td>3</td>
                <td>Amit</td>
                <td>Logout</td>
                <td>Completed</td>
            </tr>
        </table>

    </div>

</body>
</html>
