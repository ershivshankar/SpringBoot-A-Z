
<!DOCTYPE html>
<html>
<head>
    <title>Welcome Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
        }

        .navbar {
            background-color: #243b55;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
        }

        .navbar h2 {
            margin: 0;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            text-align: center;
            margin-top: 120px;
        }

        .container h1 {
            color: #243b55;
            font-size: 35px;
        }

        .container p {
            color: #666;
            font-size: 18px;
        }

        button {
            background-color: #4776e6;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background-color: #243b55;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h2>My Dashboard</h2>

        <div>
            <a href="#">Home</a>
            <a href="#">Profile</a>
            <a href="logout">Logout</a>
        </div>
    </div>

    <div class="container">

        <h1>Welcome To Our Dashboard!</h1>

        <p>Hello! You have successfully logged in.</p>

        <p>We are happy to have you here.</p>

        <button onclick="alert('Welcome to our Dashboard!')">
            Get Started
        </button>

    </div>

</body>
</html>
